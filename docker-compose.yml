# ═══════════════════════════════════════════════════════════════════════════
#  🐳  DEV STACK — Python · JavaScript · Dart/Flutter
#  Reverse proxy : Traefik  →  accès par domaine *.local
#
#  Profils disponibles :
#    - core         : Homepage (portail central), Traefik (reverse proxy)
#    - db           : Tout (ou sous-profils : postgres, mysql, redis, mongo)
#    - db_tools     : phpMyAdmin, pgAdmin, Mongo Express, Adminer
#    - ai           : OmniRoute (Passerelle IA / LLM Router)
#    - ops          : Portainer (Docker GUI), Dozzle (Logs en temps réel), Glances (monitoring)
#    - office       : Stirling-PDF, Reactive Resume, Excalidraw
#    - api_tools    : Hoppscotch, Swagger Editor, Prism Mock, JSONJoy Builder
#    - messaging    : Mailpit, RabbitMQ, Soketi
#    - storage      : MinIO
#    - automation   : n8n
#    - data         : JupyterLab
#    - search       : Meilisearch
#    - code_quality : SonarQube
#    - osint        : Flowsint (Neo4j, Redis, PostgreSQL requis)
#    - sync         : Syncthing
#    - devtools     : Alias regroupant Portainer, Excalidraw, JSONJoy Builder, OmniRoute
#
#  Démarrez toute la stack : docker compose up -d
#  Ou par profil : docker compose --profile db --profile db_tools up -d
#  Ou configurez COMPOSE_PROFILES dans votre fichier .env
#
#  Les services sont modulaires et définis dans : internal/composes/<profil>.yml
# ═══════════════════════════════════════════════════════════════════════════

name: devstack

include:
  - internal/composes/homepage.yml
  - internal/composes/traefik.yml
  - internal/composes/db.yml
  - internal/composes/db_tools.yml
  - internal/composes/ai.yml
  - internal/composes/ops.yml
  - internal/composes/office.yml
  - internal/composes/api_tools.yml
  - internal/composes/messaging.yml
  - internal/composes/storage.yml
  - internal/composes/automation.yml
  - internal/composes/data.yml
  - internal/composes/search.yml
  - internal/composes/code_quality.yml
  - internal/composes/osint.yml
  - internal/composes/sync.yml
  - internal/composes/backups.yml

networks:
  devnet:
    driver: bridge

volumes:
  mysql_data:
  postgres_data:
  redis_data:
  mongo_data:
  minio_data:
  portainer_data:
  pgadmin_data:
  rabbitmq_data:
  n8n_data:
  jupyter_data:
  meilisearch_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  syncthing_config:
  stirling_data:
  reactive_resume_data:
  omniroute_data: