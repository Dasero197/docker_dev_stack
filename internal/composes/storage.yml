# ═══════════════════════════════════════════════════════════════════════════
#  STOCKAGE OBJET (Profil: storage)
#  Démarrer : docker compose --profile storage up -d
# ═══════════════════════════════════════════════════════════════════════════

services:

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-${GLOBAL_USER:-devuser}}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-${GLOBAL_PASSWORD}}
    ports:
      - "9000:9000"
    volumes:
      - minio_data:/data
    networks:
      - devnet
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio.rule=Host(`minio.${DOMAIN_SUFFIX:-local}`)"
      - "traefik.http.services.minio.loadbalancer.server.port=9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
