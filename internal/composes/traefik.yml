# ═══════════════════════════════════════════════════════════════════════════
#  REVERSE PROXY — Traefik (Toujours actif, aucun profil requis)
# ═══════════════════════════════════════════════════════════════════════════

services:

  traefik:
    image: traefik:v3.7.1
    container_name: traefik
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=devstack_devnet
      - --entrypoints.web.address=:80
      - --log.level=WARN
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - devnet
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-ui.rule=Host(`traefik.${DOMAIN_SUFFIX:-local}`)"
      - "traefik.http.routers.traefik-ui.service=api@internal"
      - "homepage.enable=true"
      - "homepage.group=Observabilité"
      - "homepage.name=Traefik"
      - "homepage.icon=traefik.png"
      - "homepage.href=http://traefik.${DOMAIN_SUFFIX:-local}"
      - "homepage.description=Reverse Proxy"
      # Configuration du Widget Traefik :
      - "homepage.widget.type=traefik"
      - "homepage.widget.url=http://traefik:8080"
    restart: unless-stopped
