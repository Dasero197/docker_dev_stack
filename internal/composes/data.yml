# ═══════════════════════════════════════════════════════════════════════════
#  DATA SCIENCE / PYTHON (Profil: data)
#  Démarrer : docker compose --profile data up -d
# ═══════════════════════════════════════════════════════════════════════════

services:
  jupyter:
    image: quay.io/jupyter/datascience-notebook:2026-05-11
    container_name: jupyter
    profiles: ["data", "jupyter"]
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-${GLOBAL_PASSWORD}}
      GRANT_SUDO: "yes"
    volumes:
      - jupyter_data:/home/jovyan/work
      - ../../notebooks:/home/jovyan/work/notebooks
    networks:
      - devnet
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jupyter.rule=Host(`jupyter.${DOMAIN_SUFFIX:-local}`)"
      - "traefik.http.services.jupyter.loadbalancer.server.port=8888"
      - "homepage.group=Data Science"
      - "homepage.name=JupyterLab"
      - "homepage.icon=jupyter.png"
      - "homepage.href=http://jupyter.${DOMAIN_SUFFIX:-local}"
      - "homepage.description=Notebooks Python"
    restart: unless-stopped
