# ═══════════════════════════════════════════════════════════════════════════
#  AUTOMATION (Profil: automation)
#  ⚠ DÉPENDANCE : nécessite le profil 'db' actif (postgres)
#  Démarrer : docker compose --profile db --profile automation up -d
# ═══════════════════════════════════════════════════════════════════════════

include:
  - ./db.yml

services:

  n8n:
    image: n8nio/n8n@sha256:9f1f8e4c093c9924338bd168e3f813f746041d13b337753af0dbdd329e7b50f7
    container_name: n8n
    profiles: ["automation"]
    environment:
      N8N_SECURE_COOKIE: "false"
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-${GLOBAL_PASSWORD}}
      N8N_HOST: n8n.${DOMAIN_SUFFIX:-local}
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://n8n.${DOMAIN_SUFFIX:-local}/
      GENERIC_TIMEZONE: ${TIMEZONE:-Africa/Porto-Novo}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${N8N_DB_POSTGRESDB_USER:-${GLOBAL_USER:-devuser}}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_POSTGRESDB_PASSWORD:-${GLOBAL_PASSWORD}}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - devnet
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.${DOMAIN_SUFFIX:-local}`)"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
    restart: unless-stopped
